name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: write is required to mint the OIDC token npm's provenance/Trusted Publisher
    # flow uses — see https://docs.npmjs.com/generating-provenance-statements
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_ACTIONS_N8N_NODES_THREADLY }}
